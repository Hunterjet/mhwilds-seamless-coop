name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and test (MSVC x64, Ninja)
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress | Out-Null }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "call `"$vcvars`" >nul && cmake --preset release && cmake --build --preset release && ctest --preset release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload seamless_net.dll
        uses: actions/upload-artifact@v7
        with:
          name: seamless_net-${{ github.sha }}
          path: |
            build/release/src/plugin/seamless_net.dll
            build/release/src/plugin/seamless_net.pdb
          if-no-files-found: error
